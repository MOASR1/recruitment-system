<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول - نظام الاعتمادات</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="app.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style> body { font-family: 'Tajawal', sans-serif; } </style>
</head>
<body class="bg-slate-900 text-slate-800 min-h-screen flex items-center justify-center p-4">

    <div class="bg-white rounded-3xl max-w-md w-full p-8 shadow-2xl border border-slate-800 space-y-6">
        
        <!-- الهيدر واللوجو -->
        <div class="text-center space-y-2">
            <div class="w-16 h-16 bg-blue-600 rounded-2xl flex items-center justify-center text-white text-3xl font-bold shadow-lg shadow-blue-500/30 mx-auto">
                📋
            </div>
            <h1 class="text-2xl font-black text-slate-900 mt-4">نظام الاعتمادات</h1>
            <p class="text-xs text-slate-500">إدارة توظيف الموارد البشرية والموافقات</p>
        </div>

        <!-- رسالة الخطأ -->
        <div id="errorMessage" class="hidden bg-rose-50 border border-rose-200 text-rose-700 text-xs p-3.5 rounded-xl font-bold text-center">
            بريد إلكتروني أو كلمة مرور غير صحيحة.
        </div>

        <!-- نموذج تسجيل الدخول -->
        <form id="loginForm" onsubmit="handleLogin(event)" class="space-y-4">
            <div>
                <label class="block text-xs font-bold text-slate-700 mb-1.5">البريد الإلكتروني</label>
                <input type="email" id="email" required placeholder="admin@domain.com" class="w-full bg-slate-50 border border-slate-300 rounded-xl px-4 py-3 text-xs text-slate-800 focus:ring-2 focus:ring-blue-500 focus:bg-white focus:outline-none transition">
            </div>

            <div>
                <label class="block text-xs font-bold text-slate-700 mb-1.5">كلمة المرور</label>
                <input type="password" id="password" required placeholder="••••••••" class="w-full bg-slate-50 border border-slate-300 rounded-xl px-4 py-3 text-xs text-slate-800 focus:ring-2 focus:ring-blue-500 focus:bg-white focus:outline-none transition">
            </div>

            <button type="submit" id="submitBtn" class="w-full py-3.5 rounded-xl bg-blue-600 hover:bg-blue-700 text-white font-bold text-xs shadow-lg shadow-blue-500/25 transition flex items-center justify-center gap-2">
                <span id="btnText">تسجيل الدخول</span>
                <span id="btnSpinner" class="hidden animate-spin">🌀</span>
            </button>
        </form>

        <div class="pt-4 border-t border-slate-100 text-center">
            <p class="text-[11px] text-slate-400">حسابات التجربة الافتراضية:</p>
            <p class="text-[11px] text-slate-600 font-bold mt-1">مدير النظام: admin@domain.com / 123456</p>
        </div>
    </div>

    <script>
        // التحقق من حالة الجلسة عند تحميل الصفحة دون كتابة بيانات تلقائية في قوقل شيت
        window.onload = function() {
            const currentUser = App.getCurrentUser();
            if (currentUser) {
                window.location.href = 'dashboard.html';
            }
        };

        async function handleLogin(event) {
            event.preventDefault();

            const emailInput = document.getElementById('email').value.trim().toLowerCase();
            const passwordInput = document.getElementById('password').value;
            const errorDiv = document.getElementById('errorMessage');
            const submitBtn = document.getElementById('submitBtn');
            const btnText = document.getElementById('btnText');
            const btnSpinner = document.getElementById('btnSpinner');

            // إخفاء رسالة الخطأ وتفعيل حالة التحميل
            errorDiv.classList.add('hidden');
            submitBtn.disabled = true;
            btnText.innerText = 'جاري التحقق والاتصال...';
            btnSpinner.classList.remove('hidden');

            try {
                // قراءة المستخدمين من قوقل شيت (أو التخزين المحلي كاحتياط)
                const users = await App.readJson('app_users', App.defaultUsers);
                
                // البحث عن المستخدم المطابق
                const user = users.find(u => 
                    (u.email && u.email.toLowerCase() === emailInput) && 
                    (u.password === passwordInput || u.pass === passwordInput)
                );

                if (user) {
                    // حفظ جلسة الدخول في localStorage لسرعة التصفح
                    localStorage.setItem('currentUser', JSON.stringify(App.normalizeUser(user)));
                    window.location.href = 'dashboard.html';
                } else {
                    errorDiv.classList.remove('hidden');
                }
            } catch (err) {
                console.error('خطأ في تسجيل الدخول:', err);
                errorDiv.innerText = 'حدث خطأ أثناء الاتصال بالخادم، حاول مرة أخرى.';
                errorDiv.classList.remove('hidden');
            } finally {
                // إعادة الزر لحالته الطبيعية
                submitBtn.disabled = false;
                btnText.innerText = 'تسجيل الدخول';
                btnSpinner.classList.add('hidden');
            }
        }
    </script>
</body>
</html>
