<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول - نظام الاعتمادات</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
    <style> body { font-family: 'Tajawal', sans-serif; } </style>
</head>
<body class="bg-slate-100 flex items-center justify-center min-h-screen p-4">

    <div class="max-w-md w-full bg-white rounded-2xl shadow-xl p-8 border border-slate-200">
        <div class="text-center mb-6">
            <div class="w-12 h-12 bg-blue-600 rounded-xl flex items-center justify-center mx-auto mb-3 text-white font-bold text-xl shadow-md">
                📄
            </div>
            <h1 class="text-2xl font-bold text-slate-900">نظام إدارة اعتمادات التوظيف</h1>
            <p class="text-xs text-slate-500 mt-1">يرجى إدخال بيانات حسابك للمتابعة</p>
        </div>

        <!-- تنبيه الخطأ -->
        <div id="errorMessage" class="hidden mb-4 p-3 bg-red-50 border border-red-200 text-red-700 text-xs rounded-xl flex items-center gap-2">
            <span>⚠️</span>
            <span id="errorText">بيانات الدخول غير صحيحة!</span>
        </div>

        <form id="loginForm" class="space-y-4">
            <div>
                <label class="block text-xs font-semibold text-slate-700 mb-1">البريد الإلكتروني / اسم المستخدم</label>
                <input type="email" id="emailInput" required placeholder="admin@company.com" class="w-full border border-slate-300 rounded-xl p-2.5 text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none">
            </div>

            <div>
                <label class="block text-xs font-semibold text-slate-700 mb-1">كلمة المرور</label>
                <input type="password" id="passwordInput" required placeholder="••••••••" class="w-full border border-slate-300 rounded-xl p-2.5 text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none">
            </div>

            <div class="flex items-center justify-between text-xs text-slate-500">
                <label class="flex items-center gap-1.5 cursor-pointer">
                    <input type="checkbox" class="rounded border-slate-300 text-blue-600">
                    تذكر بياناتي
                </label>
                <a href="#" class="text-blue-600 hover:underline">نسيت كلمة المرور؟</a>
            </div>

            <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2.5 rounded-xl text-sm transition shadow-md flex items-center justify-center gap-2">
                <span>تسجيل الدخول</span>
                <span>←</span>
            </button>
        </form>

        <div class="mt-6 pt-4 border-t text-center text-[11px] text-slate-400">
            الحساب التجريبي: admin@company.com / كلمة المرور: 123456
        </div>
    </div>

    <script>
        // قائمة المستخدمين المصرح لهم (محاكاة قاعدة البيانات)
        const validUsers = [
            { email: "admin@company.com", pass: "123456", name: "محمد راجحي" },
            { email: "m.rajhi@company.com", pass: "hr2026", name: "محمد راجحي" }
        ];

        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const email = document.getElementById('emailInput').value.trim();
            const password = document.getElementById('passwordInput').value.trim();
            const errorDiv = document.getElementById('errorMessage');

            // التحقق من المطابقة
            const user = validUsers.find(u => u.email === email && u.pass === password);

            if (user) {
                errorDiv.classList.add('hidden');
                // حفظ الجلسة مؤقتاً
                localStorage.setItem('currentUser', user.name);
                // التوجيه للوحة التحكم
                window.location.href = 'dashboard.html';
            } else {
                errorDiv.classList.remove('hidden');
            }
        });
    </script>
</body>
</html>
