<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نظام الاعتمادات - طلب توظيف جديد</title>
    <!-- مكتبة Tailwind CSS للتصميم -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
    <style> body { font-family: 'Tajawal', sans-serif; } </style>
</head>
<body class="bg-slate-50 text-slate-800 p-6">

    <div class="max-w-4xl mx-auto bg-white rounded-xl shadow-md p-8 border border-slate-100">
        <!-- العنوان -->
        <div class="border-b pb-4 mb-6 flex justify-between items-center">
            <div>
                <h1 class="text-2xl font-bold text-slate-900">إنشاء طلب تعيين جديد</h1>
                <p class="text-slate-500 text-sm mt-1">مسؤول التوظيف: إدخال بيانات المرشح ورفع المرفقات</p>
            </div>
            <span class="bg-blue-50 text-blue-700 px-3 py-1 rounded-full text-xs font-semibold">مسودة</span>
        </div>

        <!-- شريط مسار الاعتمادات (Workflow Stepper) -->
        <div class="mb-8 bg-slate-50 p-4 rounded-lg border border-slate-200">
            <h3 class="text-xs font-bold text-slate-500 mb-3 uppercase tracking-wider">مسار الاعتماد المتوقع:</h3>
            <div class="flex items-center justify-between text-center text-xs">
                <div class="flex-1 font-bold text-blue-600">1. مسؤول التوظيف</div>
                <div class="text-slate-300">←</div>
                <div class="flex-1 text-slate-400">2. المدير المباشر</div>
                <div class="text-slate-300">←</div>
                <div class="flex-1 text-slate-400">3. مدير الشركة</div>
                <div class="text-slate-300">←</div>
                <div class="flex-1 text-slate-400">4. رئيس التشغيل</div>
                <div class="text-slate-300">←</div>
                <div class="flex-1 text-slate-400">5. مدير الموارد</div>
                <div class="text-slate-300">←</div>
                <div class="flex-1 text-slate-400">6. نائب المدير العام</div>
            </div>
        </div>

        <!-- نموذج البيانات -->
        <form id="jobRequestForm" class="space-y-6">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">اسم المرشح الكامل *</label>
                    <input type="text" required placeholder="مثال: محمد عبدالله" class="w-full border border-slate-300 rounded-lg p-2.5 focus:ring-2 focus:ring-blue-500 focus:outline-none">
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">المسمى الوظيفي المقترح *</label>
                    <input type="text" required placeholder="مثال: أخصائي HR" class="w-full border border-slate-300 rounded-lg p-2.5 focus:ring-2 focus:ring-blue-500 focus:outline-none">
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">القسم / الإدارة *</label>
                    <select class="w-full border border-slate-300 rounded-lg p-2.5 focus:ring-2 focus:ring-blue-500 focus:outline-none">
                        <option>الموارد البشرية</option>
                        <option>التقنية والتطوير</option>
                        <option>العمليات والتشغيل</option>
                        <option>المالية</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">الراتب الإجمالي المقترح (SAR) *</label>
                    <input type="number" required placeholder="12000" class="w-full border border-slate-300 rounded-lg p-2.5 focus:ring-2 focus:ring-blue-500 focus:outline-none">
                </div>
            </div>

            <!-- قسم المرفقات -->
            <div class="border-t pt-6">
                <label class="block text-sm font-medium text-slate-700 mb-2">المرفقات المطلوبة (CV، التقييم، الشهادات) *</label>
                <div class="border-2 border-dashed border-slate-300 rounded-lg p-6 text-center hover:border-blue-500 transition-colors bg-slate-50">
                    <input type="file" id="fileInput" multiple class="hidden" onchange="handleFiles(this.files)">
                    <label for="fileInput" class="cursor-pointer">
                        <p class="text-sm text-slate-600 font-medium">اضغط هنا لرفع الملفات أو قم بسحبها وإسقاطها</p>
                        <p class="text-xs text-slate-400 mt-1">PDF, DOCX, PNG (الحجم الأقصى: 10MB)</p>
                    </label>
                </div>
                <ul id="fileList" class="mt-3 space-y-2 text-sm text-slate-600"></ul>
            </div>

            <!-- أزرار الإجراءات -->
            <div class="border-t pt-6 flex justify-end gap-3">
                <button type="button" class="px-5 py-2.5 rounded-lg border border-slate-300 text-slate-600 hover:bg-slate-100 font-medium text-sm">حفظ كمسودة</button>
                <button type="submit" class="px-6 py-2.5 rounded-lg bg-blue-600 text-white hover:bg-blue-700 font-medium text-sm shadow-sm">إرسال للتمشية إلى المدير المباشر ←</button>
            </div>
        </form>
    </div>

    <script>
        // تجربة تفاعلية بسيطة لإظهار الملفات المرفوعة
        function handleFiles(files) {
            const fileList = document.getElementById('fileList');
            fileList.innerHTML = '';
            for (let i = 0; i < files.length; i++) {
                fileList.innerHTML += `<li class="flex items-center justify-between bg-blue-50 p-2 rounded border border-blue-100">
                    <span>📄 ${files[i].name}</span>
                    <span class="text-xs text-blue-600 font-bold">جاهز للرفع</span>
                </li>`;
            }
        }

        document.getElementById('jobRequestForm').addEventListener('submit', function(e) {
            e.preventDefault();
            alert('تم إرسال الطلب بنجاح إلى (المدير المباشر)!');
            window.location.href = 'approval.html'; // الانتقال لشاشة الاعتماد للتجربة
        });
    </script>
</body>
</html>
